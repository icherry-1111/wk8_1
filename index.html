<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun English Story & Grammar!</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Nanum Gothic', sans-serif;
        }
        body {
            background-color: #F0F9FF;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #7C3AED;
        }
        h1 {
            color: #7C3AED;
            font-size: 24px;
            margin-top: 0;
            text-align: center;
        }
        .guide-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            background: #F3E8FF;
            padding: 10px;
            border-radius: 16px;
        }
        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        .tag.be {
            background-color: #FEF08A;
            color: #854D0E;
            border: 2px solid #EAB308;
        }
        .tag.action {
            background-color: #BBF7D0;
            color: #166534;
            border: 2px solid #22C55E;
        }
        
        /* 지문 영역 */
        .story-section {
            background: #FAF5FF;
            border: 2px dashed #A855F7;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .story-title {
            font-size: 18px;
            font-weight: bold;
            color: #6B21A8;
        }
        .story-body {
            font-size: 19px;
            line-height: 1.8;
            color: #1E293B;
            text-align: left;
        }
        .be-verb {
            background-color: #FEF08A;
            color: #854D0E;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }
        .action-verb {
            background-color: #BBF7D0;
            color: #166534;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }
        
        /* 퀴즈 영역 */
        .quiz-section {
            background: #FFF7ED;
            border: 2px solid #F97316;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        .quiz-badge {
            background: #EA580C;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .quiz-question {
            font-size: 18px;
            font-weight: bold;
            color: #431407;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .opt-btn {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            border: 2px solid #FED7AA;
            background: white;
            color: #9A3412;
            cursor: pointer;
            transition: all 0.2s;
        }
        .opt-btn:hover {
            background: #FFEDD5;
        }
        .feedback {
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
            margin-top: 10px;
        }

        /* 버튼류 */
        .btn {
            background: #7C3AED;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #5B21B6;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5B21B6;
        }
        .btn-audio {
            background: #06B6D4;
            box-shadow: 0 4px 0 #0891B2;
            padding: 6px 14px;
            font-size: 14px;
        }
        .btn-next-q {
            background: #EA580C;
            box-shadow: 0 4px 0 #9A3412;
            margin-top: 10px;
            display: none;
        }
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 동화 읽고 문법 퀴즈 풀기!</h1>

    <!-- 색상 범례 -->
    <div class="guide-box">
        <span class="tag be">🟡 be동사 (상태/정체)</span>
        <span class="tag action">🟢 일반동사 (동작/행동)</span>
    </div>

    <!-- 5~6줄 동화 지문 -->
    <div class="story-section">
        <div class="story-header">
            <span class="story-title" id="storyTitle">🦖 Dino's Happy Day</span>
            <button class="btn btn-audio" onclick="speakFullStory()">🔊 전체 읽기</button>
        </div>
        <div class="story-body" id="storyContent">
            <!-- 지문 텍스트가 로드됩니다 -->
        </div>
    </div>

    <!-- 퀴즈 영역 (한 지문당 3문제) -->
    <div class="quiz-section">
        <div class="quiz-badge" id="quizProgress">문제 1 / 3</div>
        <div class="quiz-question" id="quizQuestion">질문을 불러오는 중...</div>
        
        <div class="options-grid" id="optionsContainer">
            <!-- 보기 버튼이 생성됩니다 -->
        </div>

        <div class="feedback" id="feedbackText"></div>
        <button class="btn btn-next-q" id="nextQBtn" onclick="nextQuestion()">다음 문제 풀어보기 ➡️</button>
    </div>

    <!-- 페이지 이동 (다른 지문) -->
    <div class="nav-footer">
        <button class="btn" onclick="prevStorySet()">⬅️ 이전 스토리</button>
        <span id="storyIndicator" style="font-weight: bold; color: #64748B;">스토리 1 / 2</span>
        <button class="btn" onclick="nextStorySet()">다음 스토리 ➡️</button>
    </div>
</div>

<script>
    // 5~6줄 분량의 지문 및 각 지문당 3개 문제 데이터
    const storyData = [
        {
            title: "🦖 Story 1: Dino's Happy Day",
            rawText: "Hello! I am Dino. I am a happy dinosaur. I live in a green forest. Every morning, I run fast and eat sweet apples. My friend Mimi is a small bird. We play together all day!",
            htmlText: `
                1. Hello! I <span class="be-verb">am</span> Dino.<br>
                2. I <span class="be-verb">am</span> a happy dinosaur.<br>
                3. I <span class="action-verb">live</span> in a green forest.<br>
                4. Every morning, I <span class="action-verb">run</span> fast and <span class="action-verb">eat</span> sweet apples.<br>
                5. My friend Mimi <span class="be-verb">is</span> a small bird.<br>
                6. We <span class="action-verb">play</span> together all day!
            `,
            quizzes: [
                {
                    q: "Q1. [be동사 찾기] 1번 문장에서 '나는 디노야'라고 정체를 말해주는 be동사는 무엇일까요?",
                    options: ["am", "live", "run", "eat"],
                    answer: 0,
                    explanation: "정답! 'I' 뒤에는 be동사 'am'을 사용해요!"
                },
                {
                    q: "Q2. [일반동사 찾기] 4번 문장에서 디노가 사과를 '먹는' 동작(일반동사)을 나타내는 단어는 무엇일까요?",
                    options: ["happy", "is", "eat", "small"],
                    answer: 2,
                    explanation: "정답! 'eat'은 얌얌 먹는 동작을 뜻하는 일반동사예요!"
                },
                {
                    q: "Q3. [지문 내용 이해] 디노의 친구 Mimi는 어떤 동물일까요?",
                    options: ["큰 곰 (bear)", "작은 새 (small bird)", "토끼 (rabbit)", "물고기 (fish)"],
                    answer: 1,
                    explanation: "정답! 5번 문장에서 Mimi는 small bird(작은 새)라고 나와요!"
                }
            ]
        },
        {
            title: "🐱 Story 2: Kitty in the Garden",
            rawText: "Look at Kitty! She is a cute cat. She sits on the warm grass. Kitty sees a red butterfly. She jumps high to catch it. We are very happy in the garden.",
            htmlText: `
                1. Look at Kitty!<br>
                2. She <span class="be-verb">is</span> a cute cat.<br>
                3. She <span class="action-verb">sits</span> on the warm grass.<br>
                4. Kitty <span class="action-verb">sees</span> a red butterfly.<br>
                5. She <span class="action-verb">jumps</span> high to catch it.<br>
                6. We <span class="be-verb">are</span> very happy in the garden.
            `,
            quizzes: [
                {
                    q: "Q1. [be동사 찾기] 2번 문장에서 '고양이는 귀여워'라고 상태를 말해주는 be동사는 무엇일까요?",
                    options: ["sits", "is", "jumps", "sees"],
                    answer: 1,
                    explanation: "정답! 'She' 뒤에서 상태를 알려주는 be동사는 'is'예요!"
                },
                {
                    q: "Q2. [일반동사 찾기] 5번 문장에서 고양이가 높이 '뛰어오르는' 동작(일반동사)을 나타내는 단어는 무엇일까요?",
                    options: ["cute", "are", "jumps", "happy"],
                    answer: 2,
                    explanation: "정답! 'jumps'는 콩콩 뛰어오르는 동작을 뜻하는 일반동사예요!"
                },
                {
                    q: "Q3. [지문 내용 이해] Kitty는 어디 위에 앉아 있나요?",
                    options: ["따뜻한 풀밭 (warm grass)", "침대 (bed)", "나무 위 (tree)", "물 속 (water)"],
                    answer: 0,
                    explanation: "정답! 3번 문장에서 Kitty는 warm grass(따뜻한 풀밭) 위에 앉아있어요!"
                }
            ]
        }
    ];

    let currentStoryIdx = 0;
    let currentQuizIdx = 0;

    function loadStory() {
        const story = storyData[currentStoryIdx];
        document.getElementById("storyTitle").innerText = story.title;
        document.getElementById("storyContent").innerHTML = story.htmlText;
        document.getElementById("storyIndicator").innerText = `스토리 ${currentStoryIdx + 1} / ${storyData.length}`;
        
        currentQuizIdx = 0;
        loadQuiz();
    }

    function loadQuiz() {
        const story = storyData[currentStoryIdx];
        const quiz = story.quizzes[currentQuizIdx];

        document.getElementById("quizProgress").innerText = `문제 ${currentQuizIdx + 1} / 3`;
        document.getElementById("quizQuestion").innerText = quiz.q;
        document.getElementById("feedbackText").innerText = "";
        document.getElementById("nextQBtn").style.display = "none";

        const optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = "";

        quiz.options.forEach((optText, index) => {
            const btn = document.createElement("button");
            btn.className = "opt-btn";
            btn.innerText = optText;
            btn.onclick = () => checkQuizAnswer(index);
            optionsContainer.appendChild(btn);
        });
    }

    function checkQuizAnswer(selectedIndex) {
        const quiz = storyData[currentStoryIdx].quizzes[currentQuizIdx];
        const feedbackEl = document.getElementById("feedbackText");
        const nextBtn = document.getElementById("nextQBtn");

        if (selectedIndex === quiz.answer) {
            feedbackEl.innerText = "🎉 " + quiz.explanation;
            feedbackEl.style.color = "#16A34A";
            speakTTS("Great Job!");
            
            if (currentQuizIdx < 2) {
                nextBtn.style.display = "inline-block";
                nextBtn.innerText = "다음 문제 풀어보기 ➡️";
            } else {
                nextBtn.style.display = "inline-block";
                nextBtn.innerText = "👏 이 지문의 3문제를 모두 풀었어요! (다음 스토리로)";
            }
        } else {
            feedbackEl.innerText = "💡 다시 한번 지문을 읽고 생각해보세요!";
            feedbackEl.style.color = "#DC2626";
            speakTTS("Try again!");
        }
    }

    function nextQuestion() {
        if (currentQuizIdx < 2) {
            currentQuizIdx++;
            loadQuiz();
        } else {
            nextStorySet();
        }
    }

    function nextStorySet() {
        if (currentStoryIdx < storyData.length - 1) {
            currentStoryIdx++;
            loadStory();
        } else {
            alert("🌟 모든 스토리와 문제를 완수했습니다! 첫 번째 스토리로 돌아갑니다.");
            currentStoryIdx = 0;
            loadStory();
        }
    }

    function prevStorySet() {
        if (currentStoryIdx > 0) {
            currentStoryIdx--;
            loadStory();
        }
    }

    function speakFullStory() {
        speakTTS(storyData[currentStoryIdx].rawText);
    }

    function speakTTS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; // 7세용 천천히 읽기 Speed
            window.speechSynthesis.speak(utterance);
        } else {
            alert("이 브라우저는 음성합성(TTS)을 지원하지 않습니다.");
        }
    }

    // 앱 시작 시 지문 및 퀴즈 로드
    window.onload = loadStory;
</script>

</body>
</html>
